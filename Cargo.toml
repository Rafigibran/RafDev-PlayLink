[package]
name = "rafdev-playlink"
version = "1.0.0"
edition = "2021"
rust-version = "1.81"
description = "RafDev PlayLink: Android screen mirroring, device control, and live-streaming output for Windows."
license = "MIT"
authors = ["RafDev"]

[[bin]]
name = "playlink"
path = "src/main.rs"

[lib]
name = "rafdev_playlink"
path = "src/lib.rs"

[dependencies]
slint = "1.10"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
openh264 = "0.4"
image = "0.25"
dirs = "6"
chrono = "0.4"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls", "json"], default-features = false }
zip = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_Media_MediaFoundation",
] }

[build-dependencies]
slint-build = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
